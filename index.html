
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRMO Video Interview Recorder</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #eef2f7;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 18px #0002;
    }

    h1 { color: #123c69; }

    video {
      width: 100%;
      max-height: 480px;
      background: #111;
      border-radius: 8px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 13px 20px;
      margin: 8px 6px 8px 0;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #startBtn { background: #15803d; color: white; }
    #stopBtn { background: #b91c1c; color: white; }
    #timer { font-size: 28px; font-weight: bold; }
    #status { font-weight: bold; }
    #notice {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 8px;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>HRMO Asynchronous Video Interview</h1>

  <p id="questionLabel">Verifying interview...</p>
  <p>Time remaining: <span id="timer">02:00</span></p>

  <video id="preview" autoplay muted playsinline></video>

  <div>
    <button id="startBtn" disabled>Start Recording</button>
    <button id="stopBtn" disabled>Stop and Submit Answer</button>
  </div>

  <p id="status">Checking interview details...</p>
  <div id="notice" role="alert"></div>
</div>

<script>
"use strict";

/* -------------------------------------------------------
   CONFIGURATION
------------------------------------------------------- */

const RECORDER_ORIGIN = window.location.origin;
const params = new URLSearchParams(window.location.search);

const rawQuestion = (params.get("q") || "").trim();
const rawSeconds = (params.get("seconds") || "").trim();

const interviewId = (params.get("interviewId") || "").trim();
const rawParentOrigin = (params.get("parentOrigin") || "").trim();

let questionNumber = 0;
let recordingSeconds = 120;
let parentOrigin = "";

let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];

let recording = false;
let completed = false;
let terminated = false;
let recordingStartedAt = 0;

let timerHandle = null;
let hiddenHandle = null;
let remainingSeconds = 120;

/* -------------------------------------------------------
   ELEMENTS
------------------------------------------------------- */

const preview = document.getElementById("preview");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const timerText = document.getElementById("timer");
const questionLabel = document.getElementById("questionLabel");
const statusText = document.getElementById("status");
const notice = document.getElementById("notice");

/* -------------------------------------------------------
   DISPLAY HELPERS
------------------------------------------------------- */

function showNotice(message) {
  notice.textContent = message;
  notice.style.display = "block";
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;

  return String(m).padStart(2, "0") + ":" +
         String(s).padStart(2, "0");
}

function clearTimers() {
  if (timerHandle !== null) {
    clearInterval(timerHandle);
    timerHandle = null;
  }

  if (hiddenHandle !== null) {
    clearTimeout(hiddenHandle);
    hiddenHandle = null;
  }
}

function stopCamera() {
  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  preview.srcObject = null;
}

/* -------------------------------------------------------
   VALIDATE PARAMETERS
------------------------------------------------------- */

function validateParentOrigin(value) {
  try {
    if (!value) return "";

    const parsed = new URL(value);

    if (parsed.protocol !== "https:") return "";
    if (parsed.origin !== value.replace(/\/+$/, "")) return "";

    return parsed.origin;
  } catch (error) {
    return "";
  }
}

function validateConfiguration() {
  if (!interviewId) {
    return "The interview ID is missing. Reopen the recorder from the official interview page.";
  }

  if (!/^[1-6]$/.test(rawQuestion)) {
    return "Invalid question number. The official page must pass a question number from 1 to 6.";
  }

  questionNumber = Number(rawQuestion);

  if (!Number.isFinite(Number(rawSeconds)) ||
      Number(rawSeconds) <= 0) {
    return "The recording duration is missing or invalid.";
  }

  recordingSeconds = Math.min(120, Math.floor(Number(rawSeconds)));

  if (recordingSeconds < 1) {
    return "The recording duration must be at least one second.";
  }

  parentOrigin = validateParentOrigin(rawParentOrigin);

  if (!parentOrigin) {
    return "The parentOrigin parameter is missing or invalid. Reopen the recorder from the official HRMO interview page.";
  }

  if (!window.opener || window.opener.closed) {
    return "The official interview page could not be detected. Reopen the recorder from the official page.";
  }

  return "";
}

/* -------------------------------------------------------
   MESSAGES TO OFFICIAL INTERVIEW PAGE
------------------------------------------------------- */

function sendToParent(type, details = {}) {
  if (!parentOrigin || !window.opener || window.opener.closed) {
    return;
  }

  window.opener.postMessage({
    type: type,
    interviewId: interviewId,
    questionNumber: questionNumber,
    ...details
  }, parentOrigin);
}

/* -------------------------------------------------------
   TERMINATE INTERVIEW
------------------------------------------------------- */

function terminateInterview(reason) {
  if (terminated || completed) return;

  terminated = true;
  recording = false;

  clearTimers();

  try {
    if (mediaRecorder &&
        mediaRecorder.state !== "inactive") {
      mediaRecorder.ondataavailable = null;
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
    }
  } catch (error) {
    // Continue closing the camera.
  }

  stopCamera();

  startBtn.disabled = true;
  stopBtn.disabled = true;

  statusText.textContent = "Interview terminated.";

  showNotice(
    "THE INTERVIEW WAS TERMINATED BECAUSE YOU LEFT, " +
    "HID, OR NAVIGATED AWAY FROM THE RECORDING WINDOW. " +
    "Return to the official HRMO interview page."
  );

  sendToParent("HRMO_INTERVIEW_TERMINATE", {
    reason: reason
  });
}

/* -------------------------------------------------------
   START RECORDING
------------------------------------------------------- */

async function startRecording() {
  if (terminated || completed || recording || !mediaStream) return;

  recordedChunks = [];

  let mimeType = "";

  if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")) {
    mimeType = "video/webm;codecs=vp9,opus";
  } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")) {
    mimeType = "video/webm;codecs=vp8,opus";
  } else if (MediaRecorder.isTypeSupported("video/webm")) {
    mimeType = "video/webm";
  }

  try {
    mediaRecorder = new MediaRecorder(
      mediaStream,
      mimeType ? { mimeType: mimeType } : undefined
    );
  } catch (error) {
    showNotice("Your browser cannot start video recording.");
    return;
  }

  mediaRecorder.ondataavailable = function(event) {
    if (event.data && event.data.size > 0) {
      recordedChunks.push(event.data);
    }
  };

  mediaRecorder.onerror = function() {
    terminateInterview("A recording error occurred.");
  };

  mediaRecorder.onstop = function() {
    if (terminated) {
      recordedChunks = [];
      return;
    }

    const blob = new Blob(recordedChunks, {
      type: mediaRecorder.mimeType || "video/webm"
    });

    recordedChunks = [];

    if (!blob.size) {
      terminateInterview("The recording file was empty.");
      return;
    }

    completed = true;
    recording = false;
    clearTimers();
    stopCamera();

    startBtn.disabled = true;
    stopBtn.disabled = true;

    statusText.textContent = "Sending recording to the official interview page...";

    sendToParent("HRMO_VIDEO_RECORDED", {
      video: blob,
      mimeType: blob.type,
      durationSeconds: Math.round(
        (Date.now() - recordingStartedAt) / 1000
      )
    });

    showNotice(
      "Your answer was recorded. Wait for confirmation from the official interview page."
    );
  };

  try {
    mediaRecorder.start(1000);

    recording = true;
    recordingStartedAt = Date.now();
    remainingSeconds = recordingSeconds;

    timerText.textContent = formatTime(remainingSeconds);
    startBtn.disabled = true;
    stopBtn.disabled = false;

    statusText.textContent = "Recording in progress.";

    timerHandle = setInterval(function() {
      if (terminated || completed) return;

      remainingSeconds--;
      timerText.textContent = formatTime(
        Math.max(0, remainingSeconds)
      );

      if (remainingSeconds <= 0) {
        stopRecording(true);
      }
    }, 1000);

  } catch (error) {
    terminateInterview("The browser failed to start recording.");
  }
}

/* -------------------------------------------------------
   STOP AND SUBMIT ANSWER
------------------------------------------------------- */

function stopRecording(timeLimitReached) {
  if (!recording || terminated || completed) return;

  recording = false;
  clearTimers();

  stopBtn.disabled = true;

  statusText.textContent = timeLimitReached
    ? "Time limit reached. Saving your answer..."
    : "Saving your answer...";

  if (mediaRecorder && mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }
}

/* -------------------------------------------------------
   HIDDEN WINDOW SECURITY
------------------------------------------------------- */

document.addEventListener("visibilitychange", function() {
  if (document.hidden && recording && !completed && !terminated) {
    hiddenHandle = setTimeout(function() {
      if (document.hidden) {
        terminateInterview(
          "The recording window remained hidden for 10 seconds."
        );
      }
    }, 10000);

  } else if (!document.hidden && hiddenHandle !== null) {
    clearTimeout(hiddenHandle);
    hiddenHandle = null;
  }
});

/* -------------------------------------------------------
   BROWSER BACK SECURITY
------------------------------------------------------- */

history.pushState({ hrmoRecorder: true }, "", location.href);

window.addEventListener("popstate", function() {
  terminateInterview("Browser Back navigation was detected.");
  history.pushState({ hrmoRecorder: true }, "", location.href);
});

/* -------------------------------------------------------
   PARENT MESSAGES
------------------------------------------------------- */

window.addEventListener("message", function(event) {
  if (event.origin !== parentOrigin) return;
  if (event.source !== window.opener) return;

  if (event.data && event.data.type === "HRMO_CLOSE_RECORDER") {
    if (!completed && !terminated) {
      terminateInterview("The official interview page ended the recording.");
    }

    window.close();
  }
});

window.addEventListener("pagehide", function() {
  if (recording && !completed && !terminated) {
    sendToParent("HRMO_INTERVIEW_TERMINATE", {
      reason: "The recording page was closed or navigated away from."
    });

    stopCamera();
  }
});

/* -------------------------------------------------------
   INITIALIZE
------------------------------------------------------- */

async function initializeRecorder() {
  const configurationError = validateConfiguration();

  if (configurationError) {
    statusText.textContent = "Verification failed.";
    showNotice(configurationError);
    return;
  }

  questionLabel.textContent =
    "Question " + questionNumber + " of 6";

  timerText.textContent = formatTime(recordingSeconds);

  sendToParent("HRMO_RECORDER_READY", {
    recorderOrigin: RECORDER_ORIGIN
  });

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    if (terminated) {
      stopCamera();
      return;
    }

    preview.srcObject = mediaStream;
    startBtn.disabled = false;

    statusText.textContent =
      "Camera ready. Click Start Recording when instructed.";

  } catch (error) {
    statusText.textContent = "Camera or microphone unavailable.";

    showNotice(
      "Allow camera and microphone access in your browser, then reopen the recorder."
    );
  }
}

startBtn.addEventListener("click", startRecording);
stopBtn.addEventListener("click", function() {
  stopRecording(false);
});

initializeRecorder();
</script>
</body>
</html>
