<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRMO Interview Recorder</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f2f5f9;color:#172033;margin:0;padding:20px}main{max-width:700px;margin:auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 3px 15px #0001}h1{color:#123d70;font-size:25px}button{border:0;border-radius:7px;padding:12px 18px;margin:8px 6px 0 0;background:#145da0;color:#fff;font-size:15px;cursor:pointer}button:disabled{background:#9aa5b1;cursor:not-allowed}#status{background:#f0f3f6;padding:12px;border-radius:6px;margin-top:16px;overflow-wrap:anywhere}video{width:100%;max-height:360px;background:#111;border-radius:8px;margin-top:12px}.warning{color:#9b1c1c;font-weight:bold}.hidden{display:none!important}</style></head>
<body><main><h1>HRMO Video Interview Recorder</h1><p id="questionInfo">Checking interview session…</p>
<p class="warning">Keep this recorder window visible. When the countdown reaches zero, recording will stop automatically and your video will be saved. After the upload succeeds, you can proceed to the next question.</p>
<video id="preview" autoplay muted playsinline></video><p id="timer">Time remaining: --:--</p>
<button id="startBtn">Start Recording</button><button id="stopBtn" disabled>Stop Recording</button><div id="status" role="status" aria-live="polite">Waiting to start.</div></main>
<script>(()=>{'use strict';
const params=new URLSearchParams(location.search),q=Number(params.get('q')),seconds=Math.min(180,Math.max(1,Number(params.get('seconds'))||120)),interviewId=params.get('interviewId')||'',parentOrigin=params.get('parentOrigin')||'';
const validParent=parentOrigin==='https://script.google.com'||/^https:\/\/[a-z0-9-]+\.script\.googleusercontent\.com$/i.test(parentOrigin)||/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/i.test(parentOrigin);
const $=id=>document.getElementById(id);let stream=null,recorder=null,chunks=[],startedAt=0,timerId=null,hiddenTimer=null,remaining=seconds,ended=false,notified=false,recordingStarted=false,recordingActive=false,finishing=false;
$('questionInfo').textContent='Question '+q+' — maximum '+Math.floor(seconds/60)+' minute'+(seconds>=120?'s':'')+(seconds%60?' '+seconds%60+' seconds':'');
if(!Number.isInteger(q)||q<1||q>7||!interviewId||!validParent||!window.opener){$('status').textContent='Invalid or unverified interview session. Close this window and reopen the recorder from the official interview page.';$('startBtn').disabled=true;}
function status(s){$('status').textContent=s}
function notifyTermination(reason){if(notified)return;notified=true;try{if(window.opener&&!window.opener.closed&&validParent)window.opener.postMessage({type:'HRMO_INTERVIEW_TERMINATE',interviewId,questionNumber:q,reason},parentOrigin)}catch(e){}status('INTERVIEW TERMINATED: '+reason+'. Return to the main interview page and contact HRMO.');$('startBtn').disabled=true;$('stopBtn').disabled=true}
function stopTracks(){try{if(stream)stream.getTracks().forEach(t=>{try{t.stop()}catch(e){}})}catch(e){}stream=null;$('preview').srcObject=null}
function terminate(reason){if(ended||!recordingActive)return;recordingActive=false;ended=true;clearInterval(timerId);clearTimeout(hiddenTimer);try{if(recorder&&recorder.state!=='inactive'){recorder.onstop=null;recorder.stop()}}catch(e){}stopTracks();notifyTermination(reason)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&recordingActive&&!ended){clearTimeout(hiddenTimer);hiddenTimer=setTimeout(()=>{if(document.visibilityState==='hidden'&&recordingActive)terminate('Recorder was hidden for 10 seconds')},10000)}else{clearTimeout(hiddenTimer);hiddenTimer=null}});
history.pushState({hrmoRecorder:true},'',location.href);window.addEventListener('popstate',()=>{if(recordingActive&&!ended)terminate('Browser Back button or navigation was used');try{history.pushState({hrmoRecorder:true},'',location.href)}catch(e){}});
window.addEventListener('pagehide',()=>{if(recordingActive&&!ended)terminate('Recorder window was closed or navigated away from')});
window.addEventListener('message',event=>{if(event.origin!==parentOrigin||event.source!==window.opener||!event.data)return;if(event.data.type==='HRMO_UPLOAD_CONFIRMED'&&event.data.questionNumber===q){recordingStarted=false;recordingActive=false;ended=true;clearInterval(timerId);clearTimeout(hiddenTimer);stopTracks();status('Video saved successfully. You may return to the main interview page.');setTimeout(()=>{try{window.close()}catch(e){}},500)}});
function updateTimer(){const n=Math.max(0,remaining);$('timer').textContent='Time remaining: '+String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
async function startRecording(){if(ended||recorder||recordingStarted)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status('This browser does not support recording. Use an updated Chrome or Edge browser.');return}$('startBtn').disabled=true;status('Requesting camera and microphone permission…');try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});if(ended){stopTracks();return}$('preview').srcObject=stream;let opts={};if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus'))opts.mimeType='video/webm;codecs=vp9,opus';else if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus'))opts.mimeType='video/webm;codecs=vp8,opus';recorder=new MediaRecorder(stream,opts);chunks=[];recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};recorder.onerror=()=>{if(recordingActive)terminate('A recording error occurred');else status('A recording error occurred while finalizing. Please contact HRMO.');};recorder.onstop=()=>{if(ended||finishing)return;finishing=true;clearInterval(timerId);const blob=new Blob(chunks,{type:'video/webm'});const durationSeconds=Math.min(seconds,Math.max(0,Math.round((Date.now()-startedAt)/1000)));stopTracks();if(!blob.size){status('No video data was captured. Contact HRMO.');return}if(blob.size>30*1024*1024){status('Recording exceeds the 30 MB upload limit. The interview has not been terminated. Contact HRMO for assistance.');return}status('Recording complete. Sending video to the main interview page…');try{if(!window.opener||window.opener.closed)throw new Error('Main interview page is closed.');window.opener.postMessage({type:'HRMO_VIDEO_RECORDED',interviewId,questionNumber:q,durationSeconds,blob},parentOrigin)}catch(e){status('Could not send the video: '+e.message+'. The interview has not been terminated; contact HRMO for assistance.')}};startedAt=Date.now();remaining=seconds;recordingStarted=true;recordingActive=true;recorder.start(1000);$('stopBtn').disabled=false;status('Recording in progress. Keep this window visible.');updateTimer();timerId=setInterval(()=>{remaining=Math.max(0,remaining-1);updateTimer();if(remaining<=0)stopRecording()},1000)}catch(e){stopTracks();recorder=null;$('startBtn').disabled=false;status('Camera/microphone access failed: '+(e.message||e)+'. Check browser permissions and try again.')}}
function stopRecording(){if(!recorder||recorder.state==='inactive'||ended||finishing)return;recordingActive=false;clearTimeout(hiddenTimer);hiddenTimer=null;$('stopBtn').disabled=true;$('startBtn').disabled=true;clearInterval(timerId);status('Recording stopped. Saving your video…');try{recorder.stop()}catch(e){terminate('Could not stop the recorder normally')}}
$('startBtn').addEventListener('click',startRecording);$('stopBtn').addEventListener('click',stopRecording);
})();</script></body></html>
