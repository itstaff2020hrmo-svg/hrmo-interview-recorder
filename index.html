
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRMO Interview Recorder</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }

    .panel {
      max-width: 800px;
      margin: auto;
    }

    video {
      width: 100%;
      max-height: 60vh;
      background: black;
      border-radius: 12px;
      margin-top: 16px;
    }

    #timer {
      font-size: 32px;
      font-weight: bold;
      margin: 16px;
    }

    #status {
      margin: 18px auto;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 15px 25px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #d62828;
      color: white;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }

    .hidden { display: none !important; }
    .recording { color: #ff7777; }
    .waiting { color: #ffd166; }
  </style>
</head>

<body>
<div class="panel">
  <h1>HRMO Video Interview</h1>
  <h2 id="questionTitle">Preparing recorder...</h2>

  <video id="preview" autoplay muted playsinline></video>

  <div id="timer">02:00</div>

  <button id="stopBtn" class="hidden" onclick="stopRecording()">
    Stop Recording
  </button>

  <p id="status">Requesting camera and microphone access...</p>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const questionNumber = Number(params.get("q"));

  const MAX_SECONDS = Math.max(
    1,
    Math.min(120, Number(params.get("seconds")) || 120)
  );

  const preview = document.getElementById("preview");
  const timer = document.getElementById("timer");
  const statusText = document.getElementById("status");
  const questionTitle = document.getElementById("questionTitle");
  const stopBtn = document.getElementById("stopBtn");

  let stream = null;
  let mediaRecorder = null;
  let chunks = [];
  let startedAt = 0;
  let stopped = false;
  let waitingForAcknowledgment = false;
  let countdownHandle = null;
  let fallbackTimer = null;

  function setStatus(message, className = "") {
    statusText.className = className;
    statusText.textContent = message;
  }

  function showTimer(seconds) {
    timer.textContent =
      String(Math.floor(seconds / 60)).padStart(2, "0") + ":" +
      String(seconds % 60).padStart(2, "0");
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    preview.srcObject = null;
  }

  async function startRecording() {
    if (!window.opener || window.opener.closed) {
      setStatus(
        "Open this recorder from the main interview page using Record Answer."
      );
      return;
    }

    if (!Number.isInteger(questionNumber) ||
        questionNumber < 1 ||
        questionNumber > 6) {
      setStatus("Invalid question number.");
      return;
    }

    questionTitle.textContent = "Question " + questionNumber;
    showTimer(MAX_SECONDS);

    if (!navigator.mediaDevices?.getUserMedia ||
        !window.MediaRecorder) {
      setStatus("Please use an updated Chrome browser on HTTPS.");
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: true
      });

      preview.srcObject = stream;
      await preview.play();

      let options = {};

      if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")) {
        options.mimeType = "video/webm;codecs=vp8,opus";
      } else if (MediaRecorder.isTypeSupported("video/webm")) {
        options.mimeType = "video/webm";
      }

      mediaRecorder = new MediaRecorder(stream, options);
      chunks = [];

      mediaRecorder.ondataavailable = event => {
        if (event.data && event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      mediaRecorder.onerror = () => {
        stopBtn.disabled = true;
        setStatus("Recording error. Please return to the interview page.");
        stopCamera();
      };

      mediaRecorder.onstop = () => {
        clearInterval(countdownHandle);
        stopBtn.classList.add("hidden");
        stopCamera();

        const blob = new Blob(chunks, { type: "video/webm" });

        if (!blob.size) {
          setStatus("No video was recorded. Please try again.");
          return;
        }

        sendVideo(blob);
      };

      mediaRecorder.start(1000);
      startedAt = Date.now();

      stopBtn.classList.remove("hidden");
      stopBtn.disabled = false;

      setStatus(
        "Recording in progress. Click Stop Recording when you finish.",
        "recording"
      );

      countdownHandle = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startedAt) / 1000);
        const remaining = Math.max(0, MAX_SECONDS - elapsed);

        showTimer(remaining);

        if (remaining <= 0) {
          stopRecording();
        }
      }, 250);

    } catch (error) {
      stopCamera();

      if (error.name === "NotAllowedError") {
        setStatus(
          "Camera or microphone permission was denied. Allow access in Chrome settings and reopen the recorder."
        );
      } else if (error.name === "NotFoundError") {
        setStatus("No camera or microphone was found.");
      } else {
        setStatus("Could not start recording: " + error.message);
      }
    }
  }

  function stopRecording() {
    if (stopped || !mediaRecorder ||
        mediaRecorder.state === "inactive") {
      return;
    }

    stopped = true;
    stopBtn.disabled = true;
    clearInterval(countdownHandle);

    setStatus("Recording stopped. Preparing video...", "waiting");

    mediaRecorder.stop();
  }

  function sendVideo(blob) {
    if (!window.opener || window.opener.closed) {
      setStatus("The main interview page is no longer open.");
      return;
    }

    waitingForAcknowledgment = true;

    const durationSeconds = Math.min(
      MAX_SECONDS,
      Math.max(1, Math.round((Date.now() - startedAt) / 1000))
    );

    setStatus("Sending the recorded video to the main page...", "waiting");

    window.opener.postMessage({
      type: "HRMO_VIDEO_RECORDED",
      questionNumber: questionNumber,
      durationSeconds: durationSeconds,
      blob: blob
    }, "*");

    fallbackTimer = setTimeout(() => {
      if (waitingForAcknowledgment) {
        setStatus(
          "Waiting for the main page to receive your video. Check the main interview page."
        );
      }
    }, 15000);
  }

  window.addEventListener("message", event => {
    if (event.source !== window.opener) return;

    const data = event.data;

    if (!data ||
        data.type !== "HRMO_VIDEO_RECEIVED" ||
        Number(data.questionNumber) !== questionNumber) {
      return;
    }

    waitingForAcknowledgment = false;
    clearTimeout(fallbackTimer);

    setStatus("Video received. Returning to the interview page.");

    stopCamera();

    setTimeout(() => window.close(), 300);
  });

  startRecording();
</script>
</body>
</html>
