
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRMO Video Interview Recorder</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px #00000015;
    }

    h1 { color: #123c69; }

    video {
      width: 100%;
      max-height: 460px;
      background: #111827;
      border-radius: 10px;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 13px 20px;
      margin: 8px 6px 8px 0;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #startBtn { background: #15803d; color: white; }
    #stopBtn { background: #b91c1c; color: white; }
    #status { font-weight: bold; margin-top: 16px; }
    #timer { font-size: 28px; font-weight: bold; }
    #notice {
      display: none;
      padding: 14px;
      margin-top: 16px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>HRMO Asynchronous Video Interview</h1>

  <p id="questionLabel">Preparing interview...</p>
  <p>Time remaining: <span id="timer">02:00</span></p>

  <video id="preview" autoplay muted playsinline></video>

  <div>
    <button id="startBtn" disabled>Start Recording</button>
    <button id="stopBtn" disabled>Stop and Submit Answer</button>
  </div>

  <p id="status">Verifying official interview page...</p>
  <div id="notice" role="alert"></div>
</div>

<script>
"use strict";

/*
 * HRMO recorder configuration.
 * The parentOrigin must be supplied by the official interview page.
 */
const RECORDER_ORIGIN = window.location.origin;
const params = new URLSearchParams(window.location.search);

const interviewId = params.get("interviewId") || "";
const questionNumber = Number(params.get("q") || "1");
const requestedSeconds = Number(params.get("seconds") || "120");
const suppliedParentOrigin = params.get("parentOrigin") || "";

const preview = document.getElementById("preview");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusText = document.getElementById("status");
const timerText = document.getElementById("timer");
const questionLabel = document.getElementById("questionLabel");
const notice = document.getElementById("notice");

let parentOrigin = "";
let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordingStartedAt = 0;
let timerHandle = null;
let visibilityHandle = null;
let remainingSeconds = Math.max(1, Math.min(requestedSeconds, 120));
let recording = false;
let completed = false;
let terminated = false;
let pageInitialized = false;

/*
 * This validates the URL format, not the identity of the parent.
 * The main page must separately validate messages from this recorder.
 */
function validateParentOrigin(value) {
  try {
    if (!value) return "";

    const parsed = new URL(value);

    if (parsed.protocol !== "https:") return "";
    if (parsed.origin !== value.replace(/\/+$/, "")) return "";

    return parsed.origin;
  } catch (error) {
    return "";
  }
}

function sendToParent(type, details = {}) {
  if (!window.opener || window.opener.closed || !parentOrigin) return;

  window.opener.postMessage({
    type,
    interviewId,
    questionNumber,
    ...details
  }, parentOrigin);
}

function showNotice(message) {
  notice.textContent = message;
  notice.style.display = "block";
}

function formatTime(totalSeconds) {
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;

  return String(minutes).padStart(2, "0") + ":" +
         String(seconds).padStart(2, "0");
}

function stopCamera() {
  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  preview.srcObject = null;
}

function clearTimers() {
  if (timerHandle) {
    clearInterval(timerHandle);
    timerHandle = null;
  }

  if (visibilityHandle) {
    clearTimeout(visibilityHandle);
    visibilityHandle = null;
  }
}

function terminateInterview(reason) {
  if (terminated || completed) return;

  terminated = true;
  recording = false;
  clearTimers();

  try {
    if (mediaRecorder &&
        mediaRecorder.state !== "inactive") {
      mediaRecorder.ondataavailable = null;
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
    }
  } catch (error) {
    // Continue with termination even if recording cannot be stopped cleanly.
  }

  stopCamera();

  startBtn.disabled = true;
  stopBtn.disabled = true;

  statusText.textContent = "Interview terminated.";
  showNotice(
    "THE INTERVIEW WAS TERMINATED BECAUSE YOU LEFT, HID, " +
    "OR NAVIGATED AWAY FROM THE RECORDING WINDOW. " +
    "Please return to the official HRMO interview page."
  );

  sendToParent("HRMO_INTERVIEW_TERMINATE", {
    reason: reason || "Recording window was hidden or exited."
  });
}

async function initializeRecorder() {
  if (!interviewId) {
    showNotice("The interview ID is missing. Reopen the recorder from the official interview page.");
    statusText.textContent = "Verification failed.";
    return;
  }

  if (!Number.isInteger(questionNumber) ||
      questionNumber < 1 ||
      questionNumber > 6) {
    showNotice("Invalid question number. Reopen the official interview page.");
    statusText.textContent = "Verification failed.";
    return;
  }

  parentOrigin = validateParentOrigin(suppliedParentOrigin);

  if (!parentOrigin) {
    showNotice(
      "The parentOrigin parameter is missing or invalid. " +
      "Close this window and reopen the recorder from the official HRMO interview page."
    );
    statusText.textContent = "Verification failed.";
    return;
  }

  if (!window.opener || window.opener.closed) {
    showNotice("The official interview page could not be detected. Close this window and reopen the recorder from the official page.");
    statusText.textContent = "Verification failed.";
    return;
  }

  /*
   * Notify the parent. The parent must check both event.origin
   * and event.source before accepting recorder messages.
   */
  sendToParent("HRMO_RECORDER_READY", {
    recorderOrigin: RECORDER_ORIGIN
  });

  questionLabel.textContent =
    "Question " + questionNumber + " of 6";

  statusText.textContent =
    "Verified. Allow camera and microphone access to continue.";

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    if (terminated) {
      stopCamera();
      return;
    }

    preview.srcObject = mediaStream;
    startBtn.disabled = false;
    statusText.textContent = "Camera ready. Click Start Recording when instructed.";
    pageInitialized = true;
  } catch (error) {
    statusText.textContent = "Camera or microphone unavailable.";
    showNotice(
      "Camera and microphone access are required. Allow access in your browser, then reopen the recorder."
    );
  }
}

function startRecording() {
  if (!pageInitialized || terminated || completed || recording) return;

  if (!mediaStream) {
    showNotice("Camera and microphone are not available.");
    return;
  }

  recordedChunks = [];

  let mimeType = "";

  if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")) {
    mimeType = "video/webm;codecs=vp9,opus";
  } else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")) {
    mimeType = "video/webm;codecs=vp8,opus";
  } else if (MediaRecorder.isTypeSupported("video/webm")) {
    mimeType = "video/webm";
  }

  try {
    mediaRecorder = new MediaRecorder(
      mediaStream,
      mimeType ? { mimeType } : undefined
    );
  } catch (error) {
    showNotice("Your browser could not start video recording.");
    return;
  }

  mediaRecorder.ondataavailable = event => {
    if (event.data && event.data.size > 0) {
      recordedChunks.push(event.data);
    }
  };

  mediaRecorder.onerror = () => {
    if (!terminated && !completed) {
      terminateInterview("A recording error occurred.");
    }
  };

  mediaRecorder.onstop = () => {
    if (terminated) {
      recordedChunks = [];
      return;
    }

    const blob = new Blob(recordedChunks, {
      type: mediaRecorder.mimeType || "video/webm"
    });

    recordedChunks = [];

    if (blob.size === 0) {
      terminateInterview("The recording was empty.");
      return;
    }

    completed = true;
    clearTimers();
    stopCamera();

    startBtn.disabled = true;
    stopBtn.disabled = true;

    statusText.textContent = "Answer recorded. Sending to the interview page...";

    /*
     * Blob is transferred to the parent using postMessage.
     * The parent page must receive this message and upload the
     * Blob to Drive using its existing server-side upload workflow.
     */
    sendToParent("HRMO_VIDEO_RECORDED", {
      video: blob,
      mimeType: blob.type,
      durationSeconds: Math.round(
        (Date.now() - recordingStartedAt) / 1000
      )
    });

    showNotice(
      "Your answer has been recorded and sent to the interview page. " +
      "Wait for confirmation before closing this window."
    );
  };

  try {
    mediaRecorder.start(1000);
    recording = true;
    recordingStartedAt = Date.now();
    remainingSeconds = Math.max(1, Math.min(requestedSeconds, 120));

    startBtn.disabled = true;
    stopBtn.disabled = false;
    statusText.textContent = "Recording in progress.";

    timerText.textContent = formatTime(remainingSeconds);

    timerHandle = setInterval(() => {
      if (terminated || completed) return;

      remainingSeconds--;
      timerText.textContent = formatTime(Math.max(0, remainingSeconds));

      if (remainingSeconds <= 0) {
        stopRecording(true);
      }
    }, 1000);
  } catch (error) {
    recording = false;
    terminateInterview("The browser could not start recording.");
  }
}

function stopRecording(timeLimitReached = false) {
  if (!recording || terminated || completed) return;

  recording = false;
  clearTimers();

  stopBtn.disabled = true;
  statusText.textContent = timeLimitReached
    ? "Time limit reached. Saving your answer..."
    : "Saving your answer...";

  if (mediaRecorder &&
      mediaRecorder.state !== "inactive") {
    mediaRecorder.stop();
  }
}

/*
 * Terminate after the recording page remains hidden for 10 seconds.
 * Short interruptions, such as a browser permission prompt, may
 * still trigger visibility changes; test this on your target browser.
 */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && recording && !completed && !terminated) {
    visibilityHandle = setTimeout(() => {
      if (document.hidden) {
        terminateInterview("Recording window remained hidden for 10 seconds.");
      }
    }, 10000);
  } else if (!document.hidden && visibilityHandle) {
    clearTimeout(visibilityHandle);
    visibilityHandle = null;
  }
});

/*
 * Browser Back navigation.
 */
history.pushState({ hrmoRecorder: true }, "", location.href);

window.addEventListener("popstate", () => {
  terminateInterview("Browser Back navigation was detected.");
  history.pushState({ hrmoRecorder: true }, "", location.href);
});

/*
 * Messages from the parent must come from the expected origin
 * and the original opener window.
 */
window.addEventListener("message", event => {
  if (event.origin !== parentOrigin) return;
  if (event.source !== window.opener) return;

  if (event.data && event.data.type === "HRMO_CLOSE_RECORDER") {
    if (!completed && !terminated) {
      terminateInterview("The official interview page ended the recording.");
    }

    window.close();
  }
});

window.addEventListener("pagehide", () => {
  if (recording && !completed && !terminated) {
    sendToParent("HRMO_INTERVIEW_TERMINATE", {
      reason: "Recording page was closed or navigated away from."
    });

    stopCamera();
  }
});

startBtn.addEventListener("click", startRecording);
stopBtn.addEventListener("click", () => stopRecording(false));

initializeRecorder();
</script>
</body>
</html>
