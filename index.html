<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HRMO Interview Recorder</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f5f9;color:#172033;margin:0;padding:20px}
main{max-width:700px;margin:auto;background:white;border-radius:12px;padding:24px;box-shadow:0 3px 15px #0001}
h1{color:#123d70}button{border:0;border-radius:6px;padding:12px 18px;margin:8px 6px 0 0;background:#145da0;color:#fff;font-size:15px;cursor:pointer}
button:disabled{background:#9aa5b1;cursor:not-allowed}#status{background:#f0f3f6;padding:12px;border-radius:6px;margin-top:16px;overflow-wrap:anywhere}
video{width:100%;max-height:360px;background:#111;border-radius:8px;margin-top:12px}.warning{color:#9b1c1c;font-weight:bold}
</style>
</head>
<body>
<main>
<h1>HRMO Video Interview Recorder</h1>
<p id="questionInfo">Preparing recorder…</p>
<p class="warning">Keep this recorder window visible. If it stays hidden for 10 seconds, the interview will be terminated.</p>
<video id="preview" autoplay muted playsinline></video>
<p id="timer">Time remaining: --:--</p>
<button id="startBtn">Start Recording</button>
<button id="stopBtn" disabled>Stop Recording</button>
<div id="status" role="status" aria-live="polite">Waiting to start.</div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const questionNumber = Number(params.get("q"));
  const seconds = Math.min(180, Math.max(1, Number(params.get("seconds")) || 120));
  const suppliedParentOrigin = params.get("parentOrigin") || "";
  const allowedParentOrigins = ["https://script.google.com", "https://script.googleusercontent.com"];
  const parentOrigin = allowedParentOrigins.includes(suppliedParentOrigin) ? suppliedParentOrigin : "";
  const $ = id => document.getElementById(id);
  let stream = null, recorder = null, chunks = [], startedAt = 0, timerId = null;
  let remaining = seconds, hiddenTimer = null, ended = false, notified = false;

  $("questionInfo").textContent = "Question " + questionNumber + " — maximum " + seconds + " seconds";
  if (!Number.isInteger(questionNumber) || questionNumber < 1 || questionNumber > 7) {
    $("status").textContent = "Invalid question number. Close this window and return to the interview.";
    $("startBtn").disabled = true;
  }

  // Detect browser Back while recorder is active. Browsers may handle navigation differently.
  history.pushState({hrmoRecorder: true}, "", location.href);
  window.addEventListener("popstate", () => {
    terminate("Browser Back button used in recorder window");
    history.pushState({hrmoRecorder: true}, "", location.href);
  });

  function sendTermination(reason) {
    if (notified) return;
    notified = true;
    try {
      if (parentOrigin && window.opener && !window.opener.closed) {
        window.opener.postMessage({type:"HRMO_INTERVIEW_TERMINATE", reason}, parentOrigin);
      }
    } catch (_) {}
    $("status").textContent = "Interview terminated: " + reason + ". You may close this window.";
    $("startBtn").disabled = true; $("stopBtn").disabled = true;
  }

  function terminate(reason) {
    if (ended) return;
    ended = true;
    clearInterval(timerId);
    clearTimeout(hiddenTimer);
    try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch (_) {}
    try { if (stream) stream.getTracks().forEach(track => track.stop()); } catch (_) {}
    sendTermination(reason);
  }

  // A hidden event can mean minimized, another tab, or a browser/app visibility change.
  // Use a 10-second grace period to reduce accidental triggers.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && !ended) {
      clearTimeout(hiddenTimer);
      hiddenTimer = setTimeout(() => {
        if (document.visibilityState === "hidden") terminate("Recorder stayed hidden for 10 seconds");
      }, 10000);
    } else {
      clearTimeout(hiddenTimer);
      hiddenTimer = null;
    }
  });

  window.addEventListener("message", event => {
    if (!parentOrigin || event.origin !== parentOrigin) return;
    if (!event.data || event.data.type !== "HRMO_VIDEO_RECEIVED") return;
    if (stream) stream.getTracks().forEach(track => track.stop());
    $("status").textContent = "Recording received. Returning to the interview…";
    setTimeout(() => window.close(), 250);
  });

  async function startRecording() {
    if (ended || recorder) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      $("status").textContent = "This browser does not support camera/microphone recording. Try a current version of Chrome or Edge.";
      return;
    }
    $("startBtn").disabled = true;
    $("status").textContent = "Requesting camera and microphone permission…";
    try {
      stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
      $("preview").srcObject = stream;
      const options = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
        ? {mimeType:"video/webm;codecs=vp9,opus"}
        : (MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus") ? {mimeType:"video/webm;codecs=vp8,opus"} : {});
      recorder = new MediaRecorder(stream, options);
      chunks = [];
      recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onerror = () => terminate("Recording error");
      recorder.onstop = () => {
        if (ended) return;
        clearInterval(timerId);
        const blob = new Blob(chunks, {type:"video/webm"});
        const durationSeconds = Math.min(seconds, Math.max(0, Math.round((Date.now()-startedAt)/1000)));
        if (!blob.size) { $("status").textContent = "No video data was captured. Contact HRMO."; return; }
        $("status").textContent = "Recording complete. Sending video to the interview page…";
        try {
          if (!window.opener || window.opener.closed) throw new Error("Interview page is no longer open.");
          if (!parentOrigin) throw new Error("The interview page origin could not be verified. Close this window and reopen the recorder from the interview page.");
          window.opener.postMessage({
            type:"HRMO_VIDEO_RECORDED", questionNumber, durationSeconds, blob
          }, parentOrigin);
        } catch (e) {
          $("status").textContent = "Could not send video to interview page: " + e.message;
        }
      };
      startedAt = Date.now(); remaining = seconds;
      recorder.start(1000);
      $("stopBtn").disabled = false;
      $("status").textContent = "Recording in progress. Keep this window visible.";
      updateTimer();
      timerId = setInterval(() => {
        remaining--;
        updateTimer();
        if (remaining <= 0) stopRecording();
      }, 1000);
    } catch (error) {
      $("status").textContent = "Camera/microphone access failed: " + (error.message || error);
      $("startBtn").disabled = false;
      if (stream) stream.getTracks().forEach(track => track.stop());
    }
  }

  function updateTimer() {
    const m = Math.floor(Math.max(0, remaining)/60);
    const s = Math.max(0, remaining)%60;
    $("timer").textContent = "Time remaining: " + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }

  function stopRecording() {
    if (!recorder || recorder.state === "inactive" || ended) return;
    $("stopBtn").disabled = true;
    clearInterval(timerId);
    recorder.stop();
    if (stream) stream.getTracks().forEach(track => track.stop());
  }

  $("startBtn").addEventListener("click", startRecording);
  $("stopBtn").addEventListener("click", stopRecording);
})();
</script>
</body>
</html>
