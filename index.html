
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRMO Video Interview Recorder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #182230;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0001;
    }
    video {
      width: 100%;
      background: #111;
      border-radius: 12px;
      margin: 12px 0;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      margin-top: 12px;
      background: #1459c7;
      color: white;
    }
    button.stop { background: #bd2929; }
    button:disabled { opacity: .5; }
    #timer { font-size: 30px; font-weight: bold; }
    #status { line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="card">
    <h2>HRMO Video Interview</h2>
    <p id="question">Preparing your recording...</p>
    <video id="preview" autoplay muted playsinline></video>
    <div id="timer">02:00</div>
    <p id="status">Requesting camera and microphone permission...</p>
    <button id="stopBtn" class="stop" disabled>Stop and Save Answer</button>
  </div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const questionNumber = Number(params.get("q") || 1);
  const LIMIT_SECONDS = 120;

  const questionEl = document.getElementById("question");
  const preview = document.getElementById("preview");
  const timerEl = document.getElementById("timer");
  const statusEl = document.getElementById("status");
  const stopBtn = document.getElementById("stopBtn");

  let stream;
  let recorder;
  let chunks = [];
  let startTime = 0;
  let timerInterval = null;
  let stopped = false;

  questionEl.textContent = "Question " + questionNumber;
  stopBtn.addEventListener("click", stopRecording);

  function showError(message) {
    statusEl.textContent = message;
    stopBtn.disabled = true;
  }

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return String(m).padStart(2, "0") + ":" +
           String(s).padStart(2, "0");
  }

  async function start() {
    try {
      if (!window.opener) {
        throw new Error(
          "Please open this recorder from the HRMO interview page."
        );
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error(
          "Camera access is unavailable. Open this page in Chrome using HTTPS."
        );
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: true
      });

      preview.srcObject = stream;

      const mimeTypes = [
        "video/webm;codecs=vp8,opus",
        "video/webm"
      ];
      const mimeType = mimeTypes.find(type =>
        window.MediaRecorder &&
        MediaRecorder.isTypeSupported(type)
      );

      if (!window.MediaRecorder || !mimeType) {
        throw new Error(
          "Video recording is not supported by this browser."
        );
      }

      recorder = new MediaRecorder(stream, { mimeType });
      chunks = [];

      recorder.ondataavailable = event => {
        if (event.data && event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      recorder.onerror = () => {
        showError("Recording failed. Please return to the interview and try again.");
      };

      recorder.onstop = sendVideoToInterviewPage;

      startTime = Date.now();
      recorder.start(1000);
      stopBtn.disabled = false;
      statusEl.textContent = "Recording. Keep this page open.";

      updateTimer();
      timerInterval = setInterval(updateTimer, 250);

    } catch (error) {
      console.error(error);
      showError(
        "Camera/microphone could not start: " + error.message +
        ". Check Chrome and Huawei app permissions, then try again."
      );
    }
  }

  function updateTimer() {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const remaining = Math.max(0, LIMIT_SECONDS - elapsed);
    timerEl.textContent = formatTime(remaining);

    if (remaining <= 0) stopRecording();
  }

  function stopRecording() {
    if (stopped) return;
    stopped = true;

    clearInterval(timerInterval);
    stopBtn.disabled = true;
    statusEl.textContent = "Preparing your video...";

    if (recorder && recorder.state !== "inactive") {
      recorder.stop();
    } else {
      releaseCamera();
      showError("No recording was created. Please return and try again.");
    }
  }

  function releaseCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    preview.srcObject = null;
  }

  function sendVideoToInterviewPage() {
    const durationSeconds = Math.min(
      LIMIT_SECONDS,
      Math.max(1, Math.round((Date.now() - startTime) / 1000))
    );

    const blob = new Blob(chunks, {
      type: recorder.mimeType || "video/webm"
    });

    releaseCamera();

    if (!blob.size) {
      showError("The video is empty. Please return and record again.");
      return;
    }

    statusEl.textContent = "Video captured. Sending it to the interview page...";
    questionEl.textContent = "Question " + questionNumber + " — Video captured";

    // The interview page checks both the sender's origin and window.
    window.opener.postMessage({
      type: "HRMO_VIDEO_RECORDED",
      questionNumber,
      durationSeconds,
      blob
    }, "*");

    statusEl.textContent =
      "Video captured. Return to the interview tab while it uploads.";
    timerEl.textContent = "DONE";
    chunks = [];
  }

  window.addEventListener("beforeunload", releaseCamera);
  start();
})();
</script>
</body>
</html>
