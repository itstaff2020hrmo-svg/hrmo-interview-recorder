
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRMO Interview Recorder</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }

    .panel {
      max-width: 800px;
      margin: auto;
    }

    video {
      width: 100%;
      max-height: 60vh;
      background: black;
      border-radius: 12px;
      margin-top: 16px;
    }

    #timer {
      font-size: 32px;
      font-weight: bold;
      margin: 16px;
    }

    #status {
      margin: 18px auto;
      max-width: 650px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .recording { color: #ff7777; }
    .waiting { color: #ffd166; }
  </style>
</head>

<body>
<div class="panel">
  <h1>HRMO Video Interview</h1>
  <h2 id="questionTitle">Preparing recorder...</h2>

  <video id="preview" autoplay muted playsinline></video>

  <div id="timer">02:00</div>
  <p id="status">Requesting camera and microphone access...</p>
</div>

<script>
  const MAX_SECONDS = Math.max(
    1,
    Math.min(
      120,
      Number(new URLSearchParams(location.search).get("seconds")) || 120
    )
  );

  const questionNumber = Number(
    new URLSearchParams(location.search).get("q")
  );

  const preview = document.getElementById("preview");
  const timer = document.getElementById("timer");
  const statusText = document.getElementById("status");
  const questionTitle = document.getElementById("questionTitle");

  let stream = null;
  let mediaRecorder = null;
  let chunks = [];
  let startedAt = 0;
  let stopped = false;
  let waitingForAcknowledgment = false;
  let fallbackTimer = null;

  let remainingSeconds = MAX_SECONDS;
  let countdownHandle = null;

  function setStatus(message, className = "") {
    statusText.className = className;
    statusText.textContent = message;
  }

  function showTimer(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;

    timer.textContent =
      String(m).padStart(2, "0") + ":" +
      String(s).padStart(2, "0");
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    preview.srcObject = null;
  }

  async function startRecording() {
    if (!window.opener || window.opener.closed) {
      setStatus(
        "The main interview page is not open. Return to the interview page and click Record Answer."
      );
      return;
    }

    if (!Number.isInteger(questionNumber) ||
        questionNumber < 1 ||
        questionNumber > 6) {
      setStatus("Invalid question number. Return to the interview page.");
      return;
    }

    questionTitle.textContent = "Question " + questionNumber;
    showTimer(remainingSeconds);

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        !window.MediaRecorder) {
      setStatus(
        "Your browser does not support camera recording. Open this page in an updated Chrome browser using HTTPS."
      );
      return;
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: true
      });

      preview.srcObject = stream;
      await preview.play();

      let options = {};

      if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")) {
        options.mimeType = "video/webm;codecs=vp8,opus";
      } else if (MediaRecorder.isTypeSupported("video/webm")) {
        options.mimeType = "video/webm";
      }

      mediaRecorder = new MediaRecorder(stream, options);
      chunks = [];

      mediaRecorder.ondataavailable = function(event) {
        if (event.data && event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      mediaRecorder.onerror = function() {
        setStatus("A recording error occurred. Please return and try again.");
        stopCamera();
      };

      mediaRecorder.onstop = function() {
        clearInterval(countdownHandle);
        stopCamera();

        const mimeType = mediaRecorder.mimeType || "video/webm";
        const blob = new Blob(chunks, { type: mimeType });

        if (!blob.size) {
          setStatus("No video was recorded. Please return and try again.");
          return;
        }

        sendVideo(blob);
      };

      mediaRecorder.start(1000);
      startedAt = Date.now();

      setStatus("Recording in progress. Speak clearly into your microphone.", "recording");

      countdownHandle = setInterval(function() {
        const elapsed = Math.floor((Date.now() - startedAt) / 1000);
        remainingSeconds = Math.max(0, MAX_SECONDS - elapsed);
        showTimer(remainingSeconds);

        if (remainingSeconds <= 0) {
          stopRecording();
        }
      }, 250);

    } catch (error) {
      stopCamera();

      let message = "Could not access the camera or microphone.";

      if (error.name === "NotAllowedError" ||
          error.name === "PermissionDeniedError") {
        message =
          "Camera or microphone permission was denied. Allow access in Chrome settings, then reopen the recorder.";
      } else if (error.name === "NotFoundError") {
        message = "No camera or microphone was found on this device.";
      } else if (error.name === "NotReadableError") {
        message = "The camera may be in use by another application. Close that application and try again.";
      }

      setStatus(message);
    }
  }

  function stopRecording() {
    if (stopped) return;
    stopped = true;

    clearInterval(countdownHandle);

    if (mediaRecorder &&
        mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      setStatus("Recording finished. Preparing your video...", "waiting");
    } else {
      stopCamera();
    }
  }

  function sendVideo(blob) {
    if (!window.opener || window.opener.closed) {
      setStatus(
        "The main interview page is no longer available. Keep this page open and contact the interviewer."
      );
      return;
    }

    const durationSeconds = Math.min(
      MAX_SECONDS,
      Math.max(0, Math.round((Date.now() - startedAt) / 1000))
    );

    waitingForAcknowledgment = true;

    setStatus(
      "Recording complete. Sending your video to the main interview page...",
      "waiting"
    );

    window.opener.postMessage(
      {
        type: "HRMO_VIDEO_RECORDED",
        questionNumber: questionNumber,
        durationSeconds: durationSeconds,
        blob: blob
      },
      "*"
    );

    // If the main page does not acknowledge receipt, do not silently close.
    fallbackTimer = setTimeout(function() {
      if (waitingForAcknowledgment) {
        setStatus(
          "The main page has not confirmed receipt yet. Check the main interview page. If the video did not arrive, return to the interview and try again.",
          "waiting"
        );
      }
    }, 15000);
  }

  window.addEventListener("message", function(event) {
    // Only accept acknowledgment from the window that opened this recorder.
    if (event.source !== window.opener) return;

    const data = event.data;

    if (!data ||
        data.type !== "HRMO_VIDEO_RECEIVED" ||
        Number(data.questionNumber) !== questionNumber) {
      return;
    }

    waitingForAcknowledgment = false;
    clearTimeout(fallbackTimer);

    setStatus(
      "Video received by the main interview page. Returning now..."
    );

    stopCamera();

    // The parent has already received the Blob and can upload it.
    setTimeout(function() {
      window.close();
    }, 300);
  });

  // Automatically request permission and start recording when opened.
  startRecording();
</script>
</body>
</html>
