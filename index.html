
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRMO Answer Recorder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0001;
    }
    video {
      width: 100%;
      background: #111;
      border-radius: 10px;
      margin-top: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #1769aa;
    }
    .stop { background: #b42318; }
    button:disabled { opacity: .5; }
    #timer { font-size: 34px; font-weight: bold; margin: 12px; }
    #status { line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<div class="card">
  <h2>HRMO Video Interview</h2>
  <h3 id="question">Preparing recorder...</h3>
  <video id="preview" autoplay muted playsinline></video>
  <div id="timer">02:00</div>
  <p id="status">Requesting camera and microphone access...</p>
  <button id="stopBtn" class="stop" disabled>Stop and Save Answer</button>
</div>

<script>
(() => {
  "use strict";

  const QUESTIONS = [
    "Tell me about yourself.",
    "Why do you want to work here?",
    "What are your greatest strengths?",
    "What is your biggest weakness?",
    "Why should we hire you?",
    "Where do you see yourself in five years?"
  ];

  const LIMIT_SECONDS = 120;
  const params = new URLSearchParams(location.search);
  const questionNumber = Number(params.get("q") || "1");

  const questionEl = document.getElementById("question");
  const preview = document.getElementById("preview");
  const timerEl = document.getElementById("timer");
  const statusEl = document.getElementById("status");
  const stopBtn = document.getElementById("stopBtn");

  let stream = null;
  let recorder = null;
  let chunks = [];
  let startedAt = 0;
  let timerInterval = null;
  let stopped = false;

  function status(message) {
    statusEl.textContent = message;
  }

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return String(mins).padStart(2, "0") + ":" +
      String(secs).padStart(2, "0");
  }

  function releaseCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    preview.srcObject = null;
  }

  function fail(message) {
    status(message);
    stopBtn.disabled = true;
    clearInterval(timerInterval);
    releaseCamera();
  }

  async function start() {
    if (!Number.isInteger(questionNumber) ||
        questionNumber < 1 ||
        questionNumber > QUESTIONS.length) {
      fail("Invalid question. Return to the interview page and try again.");
      return;
    }

    questionEl.textContent =
      "Question " + questionNumber + ": " + QUESTIONS[questionNumber - 1];

    if (!window.opener) {
      fail("This recorder must be opened from the HRMO interview page. Return to the interview and tap Answer again.");
      return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        !window.MediaRecorder) {
      fail("This browser does not support recording. Please update Chrome.");
      return;
    }

    try {
      // Camera and microphone access happens on GitHub Pages, not Apps Script.
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: true
      });

      preview.srcObject = stream;
      await preview.play();

      const mimeTypes = [
        "video/webm;codecs=vp8,opus",
        "video/webm"
      ];
      const mimeType = mimeTypes.find(type =>
        MediaRecorder.isTypeSupported(type)
      );

      if (!mimeType) {
        fail("WebM video recording is not supported by this browser.");
        return;
      }

      recorder = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: 500000,
        audioBitsPerSecond: 64000
      });

      chunks = [];

      recorder.ondataavailable = event => {
        if (event.data && event.data.size > 0) {
          chunks.push(event.data);
        }
      };

      recorder.onerror = event => {
        status("Recording error: " +
          (event.error?.message || "unknown error"));
      };

      recorder.onstop = sendVideoToInterview;

      startedAt = Date.now();
      recorder.start(1000);
      stopBtn.disabled = false;
      status("Recording started. Keep this page open.");

      updateTimer();
      timerInterval = setInterval(updateTimer, 250);

    } catch (error) {
      console.error(error);
      fail(
        "Camera/microphone permission denied: " +
        error.name + " — " + error.message +
        ". Allow Camera and Microphone in Chrome and Huawei settings, then try again."
      );
    }
  }

  function updateTimer() {
    if (!startedAt || stopped) return;

    const elapsed = Math.floor((Date.now() - startedAt) / 1000);
    const remaining = Math.max(0, LIMIT_SECONDS - elapsed);

    timerEl.textContent = formatTime(remaining);

    if (remaining <= 0) {
      stopRecording();
    }
  }

  function stopRecording() {
    if (stopped) return;
    stopped = true;

    clearInterval(timerInterval);
    timerInterval = null;
    stopBtn.disabled = true;

    status("Recording stopped. Preparing your video...");

    if (recorder && recorder.state !== "inactive") {
      recorder.stop();
    } else {
      fail("No recording was created. Return to the interview and try again.");
    }
  }

  function sendVideoToInterview() {
    const durationSeconds = Math.min(
      LIMIT_SECONDS,
      Math.max(1, Math.round((Date.now() - startedAt) / 1000))
    );

    const blob = new Blob(chunks, {
      type: recorder.mimeType || "video/webm"
    });

    chunks = [];
    releaseCamera();

    if (!blob.size) {
      fail("The video is empty. Please return to the interview and try again.");
      return;
    }

    try {
      window.opener.postMessage({
        type: "HRMO_VIDEO_RECORDED",
        questionNumber: questionNumber,
        durationSeconds: durationSeconds,
        blob: blob
      }, "*");

      timerEl.textContent = "DONE";
      status("Video captured. Return to the interview tab. Keep that tab open while the video uploads.");
    } catch (error) {
      console.error(error);
      fail("Could not send the video to the interview page. Return and try again.");
    }
  }

  stopBtn.addEventListener("click", stopRecording);
  window.addEventListener("pagehide", releaseCamera);

  start();
})();
</script>
</body>
</html>
